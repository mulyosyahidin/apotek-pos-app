services:
  server:
    image: nginx:1.28.0
    container_name: apotek-server
    restart: unless-stopped
    volumes:
      - ./nginx/logs:/var/log/nginx
      - ./docker/production/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - app-public:/var/www/html/public
      - app-storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_healthy
    networks:
      - apotek-network
      - database_database-network
      - npm-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    image: ${DOCKER_IMAGE}
    container_name: apotek-app
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - app-public:/var/www/html/public
      - app-storage:/var/www/html/storage
    networks:
      - apotek-network
      - database_database-network
    healthcheck:
      test: ["CMD", "/usr/local/bin/php-fpm-healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  scheduler:
    image: ${DOCKER_IMAGE}
    container_name: apotek-scheduler
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - app-public:/var/www/html/public
      - app-storage:/var/www/html/storage
    networks:
      - apotek-network
      - database_database-network
    command: /bin/sh -c "runuser -u www-data -- php artisan queue:work --sleep=3 --tries=1 --timeout=960 --no-interaction & while true; do runuser -u www-data -- php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  apotek-network:
    driver: bridge

  database_database-network:
    external: true

  npm-network:
    external: true

volumes:
  app-public:
  app-storage:
